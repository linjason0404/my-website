<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 公司網站</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        nav { background: #f4f4f4; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 20px; text-decoration: none; font-weight: bold; color: #333; }
        nav a:hover { color: #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <nav>
        <a href="index.html">首頁</a>
        <a href="about.html">公司介紹</a>
        <a href="contact.html">聯絡我們</a>
    </nav>

    <h1>聯絡我們</h1>
    <p>填寫下方表單，訊息將直接發送至我們的信箱：</p>

    <!-- 聯絡表單 -->
    <form id="contactForm">
        <div class="form-group">
            <label for="name">姓名：</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="phone">電話：</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label for="email">Email：</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">聯絡內容：</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" id="submitBtn">送出表單</button>
    </form>

    <script>
        // 已自動帶入你的 Google Apps Script 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyp8CDkClGSDsx1loqHh4Z2QUW9wOkToQ0WGGRxC-FzoWwfnQJ_Oy3drXRAd7g_Bw/exec";

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 防止頁面重新載入

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "傳送中...";
            submitBtn.disabled = true;

            const formData = new FormData(this);

            // 送出資料給 Google Apps Script
            fetch(GAS_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    alert('信件已成功送出！');
                    document.getElementById('contactForm').reset();
                } else {
                    alert('送出失敗：' + data.error);
                }
            })
            .catch(error => {
                alert('網路錯誤，請稍後再試');
                console.error('Error:', error);
            })
            .finally(() => {
                submitBtn.innerText = "送出表單";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
